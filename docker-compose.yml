services:
  db:
    image: pgvector/pgvector:pg17  # Postgres 17 with the pgvector extension pre-installed (needed for M9)
    environment:
      POSTGRES_USER: quotes
      POSTGRES_PASSWORD: quotes  # local development only
      POSTGRES_DB: quotes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # data survives `docker compose down`; `down -v` wipes it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotes"]
      interval: 2s
      retries: 15

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env  # ANTHROPIC_API_KEY, passed in when the container starts (not baked into the image)
    environment:
      # Inside Docker, "localhost" is the app container itself; the database is reached by its service name.
      DATABASE_URL: postgresql://quotes:quotes@db:5432/quotes
    depends_on:
      db:
        condition: service_healthy  # don't start the API until Postgres accepts connections

volumes:
  pgdata:
